<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 600px;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .message {
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
      display: flex;
      align-items: center;
      flex-direction: row;
      transition: transform 0.2s ease;
    }

    .message:hover {
      transform: translateY(-2px);
    }

    .message .sender {
      font-size: 12px;
      color: #666;
      margin-bottom: 0;
      margin-right: 12px;
      flex: 0 0 auto;
    }

    .user-message {
      background: #4CAF50;
      color: white;
      justify-content: flex-end;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.1);
    }

    .user-message .sender {
      color: rgba(255, 255, 255, 0.8);
      order: 1;
    }

    .ai-message {
      background: #E8E8E8;
      color: #333;
      box-shadow: 0 4px 12px rgba(232, 232, 232, 0.1);
    }

    .ai-message .sender {
      color: #666;
    }

    .input-container {
      display: flex;
      gap: 12px;
      width: 100%;
      position: relative;
    }

    .input-container input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #f1f1f1;
      outline: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .input-container input:focus {
      border-color: #4CAF50;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .input-container button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .input-container button:hover {
      background: linear-gradient(135deg, #45a049, #4CAF50);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .input-container button:active {
      transform: translateY(0);
    }

    .error-tip {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 69, 0, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      animation: fadeIn 0.3s ease-in;
      box-shadow: 0 4px 12px rgba(255, 69, 0, 0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 滚动条优化 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    /* 添加发送动画 */
    .message.sendAnimating {
      animation: sendAnimation 0.3s ease-out;
    }

    @keyframes sendAnimation {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    /* AI思考中动画 */
    .thinking {
      display: flex;
      align-items: center;
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 20px;
      background: #E8E8E8;
      color: #333;
      max-width: 80%;
      animation: fadeIn 0.3s ease-in;
      box-shadow: 0 4px 12px rgba(232, 232, 232, 0.1);
    }

    .thinking .sender {
      font-size: 12px;
      color: #666;
      margin-bottom: 0;
      margin-right: 12px;
      flex: 0 0 auto;
    }

    .thinking-dots {
      display: flex;
    }

    .thinking-dots span {
      width: 8px;
      height: 8px;
      margin: 0 2px;
      background-color: #666;
      border-radius: 50%;
      display: inline-block;
      animation: thinking 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .thinking-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes thinking {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1.0);
      }
    }

    /* 按钮容器样式 */
    .button-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }

    .clear-button {
      padding: 8px 16px;
      background: linear-gradient(135deg, #ff7043, #ff5722);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
    }

    .clear-button:hover {
      background: linear-gradient(135deg, #ff5722, #ff7043);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(255, 87, 34, 0.2);
    }

    .clear-button:active {
      transform: translateY(0);
    }

    /* 提示消息样式 */
    .toast-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .toast-message.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <h1>本地知音</h1>
  <div class="chat-container">
    <div class="error-tip" id="error-tip">发送失败，请稍后再试。</div>
    <div class="button-container">
      <button class="clear-button" id="clear-cache-btn">清除聊天记录</button>
    </div>
    <div class="chat-box" id="chat-box">
      <!-- 聊天内容显示区域 -->
    </div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="请输入问题..." />
      <button onclick="sendMessage()">
        <span>发送</span>
      </button>
    </div>
  </div>
  <div class="toast-message" id="toast-message"></div>

  <script>
    let thinkingElement = null;
    // 定义消息缓存数组
    let chatMessages = [];

    window.onload = function () {
      // 从本地存储加载聊天记录
      loadChatHistory();

      // 如果没有历史记录，显示欢迎消息
      if (chatMessages.length === 0) {
        appendMessage("您好！请随时询问我任何关于新闻的疑问，我会基于本地新闻库，为您提供准确的信息。", 'ai');
        // 保存欢迎消息到缓存已经在appendMessage中完成，这里不需要重复调用
      }

      // 添加清除缓存按钮事件
      document.getElementById('clear-cache-btn').addEventListener('click', clearChatHistory);
    };

    // 加载聊天历史记录
    function loadChatHistory() {
      try {
        const savedMessages = localStorage.getItem('aiAssistantChatHistory');
        if (savedMessages) {
          chatMessages = JSON.parse(savedMessages);

          // 清空聊天框
          const chatBox = document.getElementById('chat-box');
          chatBox.innerHTML = '';

          // 重新显示所有消息
          chatMessages.forEach(msg => {
            appendMessage(msg.content, msg.sender, false);
          });
        }
      } catch (error) {
        console.error('加载聊天历史失败:', error);
      }
    }

    // 保存单条消息到缓存
    function saveChatMessage(message, sender) {
      chatMessages.push({
        content: message,
        sender: sender,
        timestamp: new Date().toISOString()
      });

      // 保存到本地存储
      localStorage.setItem('aiAssistantChatHistory', JSON.stringify(chatMessages));
    }

    // 清除聊天历史
    function clearChatHistory() {
      // 清空本地存储
      localStorage.removeItem('aiAssistantChatHistory');

      // 清空缓存数组
      chatMessages = [];

      // 清空聊天框
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      // 显示欢迎消息
      // appendMessage("您好！请随时询问我任何关于新闻的疑问，我会尽力为您提供准确的信息。", 'ai');

      // 保存欢迎消息到缓存已经在appendMessage中完成，这里不需要重复调用
      // saveChatMessage("您好！请随时询问我任何关于新闻的疑问，我会尽力为您提供准确的信息。", 'ai');

      // 显示提示消息
      showToast('聊天记录已清除');
    }

    // 显示提示消息
    function showToast(message) {
      const toast = document.getElementById('toast-message');
      toast.textContent = message;
      toast.classList.add('show');

      // 3秒后隐藏提示
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function showThinking() {
      const chatBox = document.getElementById('chat-box');

      // 如果已经有思考元素，则不再创建
      if (thinkingElement) return;

      thinkingElement = document.createElement('div');
      thinkingElement.classList.add('thinking');

      const senderElement = document.createElement('div');
      senderElement.classList.add('sender');
      senderElement.textContent = 'AI';

      const thinkingDots = document.createElement('div');
      thinkingDots.classList.add('thinking-dots');

      // 添加三个点
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        thinkingDots.appendChild(dot);
      }

      thinkingElement.appendChild(senderElement);
      thinkingElement.appendChild(thinkingDots);

      chatBox.appendChild(thinkingElement);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideThinking() {
      if (thinkingElement) {
        thinkingElement.remove();
        thinkingElement = null;
      }
    }

    function appendMessage(message, sender, saveToCache = true) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');

      // 添加发送者名称
      const senderElement = document.createElement('div');
      senderElement.classList.add('sender');
      senderElement.textContent = sender === 'user' ? '你' : 'AI';

      const contentElement = document.createElement('div');
      contentElement.textContent = message;

      if (sender === 'user') {
        div.appendChild(contentElement);
        div.appendChild(senderElement);
      } else {
        div.appendChild(senderElement);
        div.appendChild(contentElement);
      }

      // 添加发送动画
      div.classList.add('sendAnimating');
      chatBox.appendChild(div);

      // 动画结束后移除动画类
      setTimeout(() => {
        div.classList.remove('sendAnimating');
      }, 300);

      chatBox.scrollTop = chatBox.scrollHeight;

      // 如果需要保存到缓存
      if (saveToCache) {
        saveChatMessage(message, sender);
      }
    }

    async function sendMessage() {
      try {
        const userInput = document.getElementById('user-input').value.trim();
        if (!userInput) return;

        // 显示发送中的状态
        const errorTip = document.getElementById('error-tip');
        errorTip.style.display = 'none';

        appendMessage(userInput, 'user'); // 用户消息

        // 清空输入框
        document.getElementById('user-input').value = '';

        // 显示AI思考中的动画
        showThinking();

        // 发送请求到后端 Flask
        const response = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: userInput })
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await response.json();

        // 隐藏思考动画
        hideThinking();

        appendMessage(data.answer, 'ai'); // AI回复
      } catch (error) {
        console.error('Error:', error);
        // 隐藏思考动画
        hideThinking();
        showErrorTip();
      }
    }

    function showErrorTip() {
      const errorTip = document.getElementById('error-tip');
      errorTip.style.display = 'block';
      setTimeout(() => {
        errorTip.style.display = 'none';
      }, 3000);
    }

    // ImmediateMode：按回车键发送消息
    document.getElementById('user-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>

</html>
