<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/backend/css/register.css">
</head>

<body>
    <div class="register-container">
        <div id="flash-container"></div>
        <form class="register-form" action="/register" method="POST">
            <h1>创建账号</h1>

            <!-- 用户名输入框 -->
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <!-- 密码输入框 -->
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="password-strength">
                    <div class="password-strength-meter" id="password-meter"></div>
                </div>
                <div class="password-strength-text" id="password-strength-text"></div>
            </div>

            <!-- 确认密码输入框 -->
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <div class="input-group">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
                    <i class="fas fa-check-circle"></i>
                </div>
                <div id="password-match-message" style="font-size: 12px; margin-top: 5px; color: var(--light-text);">
                </div>
            </div>

            <!-- 注册按钮 -->
            <button type="submit" id="submit-btn">注册</button>

            <!-- 登录链接 -->
            <div class="login-link">
                已经有账号？<a href="/login">立即登录</a>
            </div>
        </form>
    </div>

    <script>
        // 获取 Flask 的 flash 消息
        const flashMessages = JSON.parse('{{ get_flashed_messages(with_categories=true) | tojson | safe }}');
        const flashContainer = document.getElementById('flash-container');

        // 显示消息
        if (flashMessages && flashMessages.length > 0) {
            flashMessages.forEach(([category, message]) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flash-message ${category}`;
                messageDiv.textContent = message;
                messageDiv.style.display = 'block';
                flashContainer.appendChild(messageDiv);

                // 5秒后自动消失
                setTimeout(() => {
                    messageDiv.style.opacity = '0';
                    messageDiv.style.transition = 'opacity 0.5s';
                    setTimeout(() => {
                        messageDiv.remove();
                    }, 500);
                }, 5000);
            });
        }

        // 密码强度检测
        const passwordInput = document.getElementById('password');
        const passwordMeter = document.getElementById('password-meter');
        const passwordStrengthText = document.getElementById('password-strength-text');

        passwordInput.addEventListener('input', function () {
            const password = this.value;
            let strength = 0;
            let strengthText = '';

            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            switch (strength) {
                case 0:
                    passwordMeter.style.width = '0%';
                    passwordMeter.style.backgroundColor = '#eee';
                    strengthText = '';
                    break;
                case 1:
                    passwordMeter.style.width = '25%';
                    passwordMeter.style.backgroundColor = '#e74c3c';
                    strengthText = '弱';
                    break;
                case 2:
                    passwordMeter.style.width = '50%';
                    passwordMeter.style.backgroundColor = '#f39c12';
                    strengthText = '中';
                    break;
                case 3:
                    passwordMeter.style.width = '75%';
                    passwordMeter.style.backgroundColor = '#3498db';
                    strengthText = '强';
                    break;
                case 4:
                    passwordMeter.style.width = '100%';
                    passwordMeter.style.backgroundColor = '#2ecc71';
                    strengthText = '非常强';
                    break;
            }

            passwordStrengthText.textContent = strengthText;
        });

        // 密码匹配检测
        const confirmPasswordInput = document.getElementById('confirm_password');
        const passwordMatchMessage = document.getElementById('password-match-message');
        const submitBtn = document.getElementById('submit-btn');

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (confirmPassword === '') {
                passwordMatchMessage.textContent = '';
                passwordMatchMessage.style.color = 'var(--light-text)';
                return;
            }

            if (password === confirmPassword) {
                passwordMatchMessage.textContent = '密码匹配';
                passwordMatchMessage.style.color = 'var(--success-color)';
                submitBtn.disabled = false;
            } else {
                passwordMatchMessage.textContent = '密码不匹配';
                passwordMatchMessage.style.color = 'var(--error-color)';
                submitBtn.disabled = true;
            }
        }

        confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        passwordInput.addEventListener('input', function () {
            if (confirmPasswordInput.value !== '') {
                checkPasswordMatch();
            }
        });

        // 密码可见性切换
        document.addEventListener('DOMContentLoaded', function () {
            const passwordFields = [passwordInput, confirmPasswordInput];

            passwordFields.forEach(field => {
                const icon = field.nextElementSibling;

                icon.addEventListener('click', function () {
                    const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
                    field.setAttribute('type', type);

                    if (field.id === 'password') {
                        this.classList.toggle('fa-lock');
                        this.classList.toggle('fa-unlock');
                    } else {
                        this.classList.toggle('fa-check-circle');
                        this.classList.toggle('fa-eye');
                    }
                });
            });
        });
    </script>
</body>

</html>
