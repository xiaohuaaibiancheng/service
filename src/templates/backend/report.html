<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户协作平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/backend/css/report.css">
</head>

<body>
  <header class="page-header">
    <h1 class="page-title">用户协作平台</h1>
    <div class="back-button">
      <button onclick="window.location.href='/home'">
        <i class="fas fa-arrow-left"></i> 返回首页
      </button>
    </div>
  </header>

  <main class="main-content">
    <!-- 导航按钮 -->
    <div class="nav-buttons">
      <button class="nav-button active" data-target="report-section">
        <i class="fas fa-flag"></i> {% if user == 'felix' %}举报确认{% else %}举报提交区{% endif %}
      </button>
      <button class="nav-button" data-target="dashboard-section">
        <i class="fas fa-project-diagram"></i> 证据链看板
      </button>
      <button class="nav-button" data-target="leaderboard-section">
        <i class="fas fa-trophy"></i> 贡献排行榜
      </button>
      <button class="nav-button" data-target="forum-section">
        <i class="fas fa-comments"></i> 社区讨论
      </button>
    </div>

    <!-- 内容区域 -->
    <div class="content-container">
      <!-- 举报提交区/确认区 -->
      <div id="report-section" class="iframe-container active">
        <div class="loading-indicator"><i class="fas fa-spinner"></i></div>
        {% if user == 'felix' %}
        <iframe src="/review_page" onload="this.previousElementSibling.style.display='none'"></iframe>
        {% else %}
        <iframe src="/report_submit" onload="this.previousElementSibling.style.display='none'"></iframe>
        {% endif %}
      </div>

      <!-- 证据链看板 -->
      <div id="dashboard-section" class="iframe-container">
        <div class="loading-indicator"><i class="fas fa-spinner"></i></div>
        <iframe src="/report_crowdfunding_dashboard" onload="this.previousElementSibling.style.display='none'"></iframe>
      </div>

      <!-- 贡献排行榜 -->
      <div id="leaderboard-section" class="iframe-container">
        <div class="loading-indicator"><i class="fas fa-spinner"></i></div>
        <iframe src="/report_leaderboard" onload="this.previousElementSibling.style.display='none'"></iframe>
      </div>

      <!-- 社区讨论区 -->
      <div id="forum-section" class="iframe-container">
        <div class="loading-indicator"><i class="fas fa-spinner"></i></div>
        <iframe src="/report_discussion_forum" onload="this.previousElementSibling.style.display='none'"></iframe>
      </div>
    </div>
  </main>

  <script>
    // 添加页面加载动画
    document.addEventListener('DOMContentLoaded', function () {
      document.body.classList.add('loaded');

      // 导航按钮切换功能
      const navButtons = document.querySelectorAll('.nav-button');
      navButtons.forEach(button => {
        button.addEventListener('click', function () {
          // 移除所有按钮的active类
          navButtons.forEach(btn => btn.classList.remove('active'));
          // 给当前点击的按钮添加active类
          this.classList.add('active');

          // 隐藏所有内容区域
          const iframeContainers = document.querySelectorAll('.iframe-container');
          iframeContainers.forEach(container => container.classList.remove('active'));

          // 显示对应的内容区域
          const targetId = this.getAttribute('data-target');
          document.getElementById(targetId).classList.add('active');
        });
      });
    });
  </script>
</body>

</html>
