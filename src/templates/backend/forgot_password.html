<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码</title>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #4a6cf7;
      --primary-hover: #3a56d4;
      --text-color: #333;
      --light-text: #666;
      --border-color: #e0e0e0;
      --error-color: #e74c3c;
      --success-color: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      position: relative;
      color: var(--text-color);
    }

    .forgot-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      width: 400px;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .forgot-form h1 {
      text-align: center;
      margin-bottom: 30px;
      color: var(--text-color);
      font-weight: 600;
      font-size: 28px;
      position: relative;
      padding-bottom: 10px;
    }

    .forgot-form h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--light-text);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      color: #aaa;
      transition: color 0.3s;
    }

    input {
      padding: 12px 15px 12px 45px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      font-size: 15px;
      transition: all 0.3s;
      background-color: #f9f9f9;
    }

    input:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
      background-color: #fff;
    }

    input:focus+i {
      color: var(--primary-color);
    }

    button {
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(74, 108, 247, 0.2);
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(74, 108, 247, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(74, 108, 247, 0.2);
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      font-size: 15px;
      color: var(--light-text);
    }

    .login-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .login-link a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .flash-message {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
      font-weight: 500;
    }

    .flash-message.error {
      background-color: rgba(231, 76, 60, 0.1);
      color: var(--error-color);
      border: 1px solid rgba(231, 76, 60, 0.2);
    }

    .flash-message.success {
      background-color: rgba(46, 204, 113, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(46, 204, 113, 0.2);
    }

    .steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .step {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .step-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #f1f1f1;
      color: var(--light-text);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .step.active .step-number {
      background-color: var(--primary-color);
      color: white;
    }

    .step-title {
      font-size: 12px;
      color: var(--light-text);
      transition: all 0.3s;
    }

    .step.active .step-title {
      color: var(--primary-color);
      font-weight: 600;
    }

    .step-line {
      position: absolute;
      top: 15px;
      left: 50%;
      right: -50%;
      height: 2px;
      background-color: #f1f1f1;
      z-index: -1;
    }

    .step:last-child .step-line {
      display: none;
    }

    .step-content {
      display: none;
    }

    .step-content.active {
      display: block;
      animation: fadeIn 0.5s ease-out;
    }

    .verification-code {
      display: flex;
      gap: 10px;
    }

    .verification-code input {
      flex: 1;
      text-align: center;
      padding-left: 0;
      padding-right: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .resend-button {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      margin-top: 10px;
      box-shadow: none;
      font-weight: 500;
      text-align: right;
      width: auto;
      float: right;
    }

    .resend-button:hover {
      color: var(--primary-hover);
      text-decoration: underline;
      background: none;
      box-shadow: none;
      transform: none;
    }

    .resend-button:disabled {
      color: var(--light-text);
      cursor: not-allowed;
      text-decoration: none;
    }

    .timer {
      font-size: 14px;
      color: var(--light-text);
      margin-left: 5px;
    }

    /* 响应式设计 */
    @media (max-width: 480px) {
      .forgot-container {
        width: 90%;
        padding: 30px 20px;
        margin: 0 15px;
      }

      .forgot-form h1 {
        font-size: 24px;
      }

      input {
        padding: 10px 15px 10px 40px;
        font-size: 14px;
      }

      button {
        padding: 12px;
        font-size: 15px;
      }

      .steps {
        margin-bottom: 20px;
      }

      .step-number {
        width: 25px;
        height: 25px;
        font-size: 12px;
      }

      .step-title {
        font-size: 10px;
      }
    }

    /* 动画效果 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .forgot-container {
      animation: fadeIn 0.5s ease-out;
    }
  </style>
</head>

<body>
  <div class="forgot-container">
    <div id="flash-container"></div>
    <form class="forgot-form" action="/forgot-password" method="POST">
      <h1>找回密码</h1>

      <div class="steps">
        <div class="step active" id="step1">
          <div class="step-number">1</div>
          <div class="step-title">验证身份</div>
          <div class="step-line"></div>
        </div>
        <div class="step" id="step2">
          <div class="step-number">2</div>
          <div class="step-title">重置密码</div>
          <div class="step-line"></div>
        </div>
        <div class="step" id="step3">
          <div class="step-number">3</div>
          <div class="step-title">完成</div>
        </div>
      </div>

      <!-- 步骤1：验证身份 -->
      <div class="step-content active" id="step1-content">
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-group">
            <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="verification_code">验证码</label>
          <div class="input-group">
            <input type="text" id="verification_code" name="verification_code" placeholder="请输入验证码" required>
            <i class="fas fa-shield-alt"></i>
          </div>
          <button type="button" id="send-code-btn" class="resend-button">发送验证码</button>
          <span id="timer" class="timer"></span>
        </div>

        <button type="button" id="verify-btn">验证身份</button>
      </div>

      <!-- 步骤2：重置密码 -->
      <div class="step-content" id="step2-content">
        <div class="form-group">
          <label for="new_password">新密码</label>
          <div class="input-group">
            <input type="password" id="new_password" name="new_password" placeholder="请输入新密码" required>
            <i class="fas fa-lock"></i>
          </div>
          <div class="password-strength">
            <div class="password-strength-meter" id="password-meter"></div>
          </div>
          <div class="password-strength-text" id="password-strength-text"></div>
        </div>

        <div class="form-group">
          <label for="confirm_password">确认新密码</label>
          <div class="input-group">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入新密码" required>
            <i class="fas fa-check-circle"></i>
          </div>
          <div id="password-match-message" style="font-size: 12px; margin-top: 5px; color: var(--light-text);"></div>
        </div>

        <button type="button" id="reset-btn">重置密码</button>
      </div>

      <!-- 步骤3：完成 -->
      <div class="step-content" id="step3-content">
        <div style="text-align: center; margin: 30px 0;">
          <i class="fas fa-check-circle" style="font-size: 60px; color: var(--success-color);"></i>
          <h2 style="margin-top: 20px; color: var(--text-color);">密码重置成功</h2>
          <p style="margin-top: 10px; color: var(--light-text);">您的密码已成功重置，现在可以使用新密码登录了。</p>
        </div>

        <a href="/login"><button type="button">返回登录</button></a>
      </div>

      <!-- 登录链接 -->
      <div class="login-link">
        记起密码了？<a href="/login">立即登录</a>
      </div>
    </form>
  </div>

  <script>
    // 获取 Flask 的 flash 消息
    const flashMessages = JSON.parse('{{ get_flashed_messages(with_categories=true) | tojson | safe }}');
    const flashContainer = document.getElementById('flash-container');

    // 显示消息
    if (flashMessages && flashMessages.length > 0) {
      flashMessages.forEach(([category, message]) => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `flash-message ${category}`;
        messageDiv.textContent = message;
        messageDiv.style.display = 'block';
        flashContainer.appendChild(messageDiv);

        // 5秒后自动消失
        setTimeout(() => {
          messageDiv.style.opacity = '0';
          messageDiv.style.transition = 'opacity 0.5s';
          setTimeout(() => {
            messageDiv.remove();
          }, 500);
        }, 5000);
      });
    }

    // 初始化当前步骤
    const currentStep = parseInt('{{ step|default(1) }}');
    if (currentStep > 1) {
      goToStep(currentStep - 1);
    }

    // 步骤切换
    const steps = document.querySelectorAll('.step');
    const stepContents = document.querySelectorAll('.step-content');

    function goToStep(stepNumber) {
      // 更新步骤指示器
      steps.forEach((step, index) => {
        if (index < stepNumber) {
          step.classList.add('active');
        } else if (index === stepNumber) {
          step.classList.add('active');
        } else {
          step.classList.remove('active');
        }
      });

      // 显示对应步骤内容
      stepContents.forEach((content, index) => {
        if (index === stepNumber) {
          content.classList.add('active');
        } else {
          content.classList.remove('active');
        }
      });
    }

    // 验证身份按钮
    document.getElementById('verify-btn').addEventListener('click', function () {
      const username = document.getElementById('username').value;
      const verificationCode = document.getElementById('verification_code').value;

      if (!username || !verificationCode) {
        showMessage('请填写所有必填字段', 'error');
        return;
      }

      // 创建表单并提交
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/forgot-password';
      form.style.display = 'none';

      const actionInput = document.createElement('input');
      actionInput.type = 'hidden';
      actionInput.name = 'action';
      actionInput.value = 'verify';
      form.appendChild(actionInput);

      const usernameInput = document.createElement('input');
      usernameInput.type = 'hidden';
      usernameInput.name = 'username';
      usernameInput.value = username;
      form.appendChild(usernameInput);

      const codeInput = document.createElement('input');
      codeInput.type = 'hidden';
      codeInput.name = 'verification_code';
      codeInput.value = verificationCode;
      form.appendChild(codeInput);

      document.body.appendChild(form);
      form.submit();
    });

    // 重置密码按钮
    document.getElementById('reset-btn').addEventListener('click', function () {
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (!newPassword || !confirmPassword) {
        showMessage('请填写所有必填字段', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('两次输入的密码不一致', 'error');
        return;
      }

      // 创建表单并提交
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/forgot-password';
      form.style.display = 'none';

      const actionInput = document.createElement('input');
      actionInput.type = 'hidden';
      actionInput.name = 'action';
      actionInput.value = 'reset';
      form.appendChild(actionInput);

      const passwordInput = document.createElement('input');
      passwordInput.type = 'hidden';
      passwordInput.name = 'new_password';
      passwordInput.value = newPassword;
      form.appendChild(passwordInput);

      const confirmInput = document.createElement('input');
      confirmInput.type = 'hidden';
      confirmInput.name = 'confirm_password';
      confirmInput.value = confirmPassword;
      form.appendChild(confirmInput);

      document.body.appendChild(form);
      form.submit();
    });

    // 发送验证码按钮
    document.getElementById('send-code-btn').addEventListener('click', function () {
      const username = document.getElementById('username').value;

      if (!username) {
        showMessage('请先输入用户名', 'error');
        return;
      }

      // 禁用按钮并开始倒计时
      const button = this;
      button.disabled = true;
      let seconds = 60;
      const timer = document.getElementById('timer');

      timer.textContent = `(${seconds}秒)`;

      const interval = setInterval(() => {
        seconds--;
        timer.textContent = `(${seconds}秒)`;

        if (seconds <= 0) {
          clearInterval(interval);
          button.disabled = false;
          timer.textContent = '';
        }
      }, 1000);

      // 发送请求到服务器获取验证码
      const formData = new FormData();
      formData.append('username', username);

      fetch('/send-verification-code', {
        method: 'POST',
        body: formData
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            showMessage(data.message, 'success');
            // 在开发环境中显示验证码（实际生产环境不应该这样做）
            if (data.code) {
              document.getElementById('verification_code').value = data.code;
            }
          } else {
            showMessage(data.message, 'error');
            // 如果失败，重置倒计时
            clearInterval(interval);
            button.disabled = false;
            timer.textContent = '';
          }
        })
        .catch(error => {
          console.error('Error:', error);
          showMessage('发送验证码失败，请稍后重试', 'error');
          // 如果失败，重置倒计时
          clearInterval(interval);
          button.disabled = false;
          timer.textContent = '';
        });
    });

    // 密码强度检测
    const passwordInput = document.getElementById('new_password');
    const passwordMeter = document.getElementById('password-meter');
    const passwordStrengthText = document.getElementById('password-strength-text');

    if (passwordInput) {
      passwordInput.addEventListener('input', function () {
        const password = this.value;
        let strength = 0;
        let strengthText = '';

        if (password.length >= 8) strength += 1;
        if (/[A-Z]/.test(password)) strength += 1;
        if (/[0-9]/.test(password)) strength += 1;
        if (/[^A-Za-z0-9]/.test(password)) strength += 1;

        switch (strength) {
          case 0:
            passwordMeter.style.width = '0%';
            passwordMeter.style.backgroundColor = '#eee';
            strengthText = '';
            break;
          case 1:
            passwordMeter.style.width = '25%';
            passwordMeter.style.backgroundColor = '#e74c3c';
            strengthText = '弱';
            break;
          case 2:
            passwordMeter.style.width = '50%';
            passwordMeter.style.backgroundColor = '#f39c12';
            strengthText = '中';
            break;
          case 3:
            passwordMeter.style.width = '75%';
            passwordMeter.style.backgroundColor = '#3498db';
            strengthText = '强';
            break;
          case 4:
            passwordMeter.style.width = '100%';
            passwordMeter.style.backgroundColor = '#2ecc71';
            strengthText = '非常强';
            break;
        }

        passwordStrengthText.textContent = strengthText;
      });
    }

    // 密码匹配检测
    const confirmPasswordInput = document.getElementById('confirm_password');
    const passwordMatchMessage = document.getElementById('password-match-message');

    if (confirmPasswordInput && passwordInput) {
      function checkPasswordMatch() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (confirmPassword === '') {
          passwordMatchMessage.textContent = '';
          passwordMatchMessage.style.color = 'var(--light-text)';
          return;
        }

        if (password === confirmPassword) {
          passwordMatchMessage.textContent = '密码匹配';
          passwordMatchMessage.style.color = 'var(--success-color)';
        } else {
          passwordMatchMessage.textContent = '密码不匹配';
          passwordMatchMessage.style.color = 'var(--error-color)';
        }
      }

      confirmPasswordInput.addEventListener('input', checkPasswordMatch);
      passwordInput.addEventListener('input', function () {
        if (confirmPasswordInput.value !== '') {
          checkPasswordMatch();
        }
      });
    }

    // 显示消息函数
    function showMessage(message, category) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `flash-message ${category}`;
      messageDiv.textContent = message;
      messageDiv.style.display = 'block';
      flashContainer.appendChild(messageDiv);

      // 5秒后自动消失
      setTimeout(() => {
        messageDiv.style.opacity = '0';
        messageDiv.style.transition = 'opacity 0.5s';
        setTimeout(() => {
          messageDiv.remove();
        }, 500);
      }, 5000);
    }

    // 密码可见性切换
    document.addEventListener('DOMContentLoaded', function () {
      const passwordFields = [
        document.getElementById('new_password'),
        document.getElementById('confirm_password')
      ];

      passwordFields.forEach(field => {
        if (field) {
          const icon = field.nextElementSibling;

          icon.addEventListener('click', function () {
            const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
            field.setAttribute('type', type);

            if (field.id === 'new_password') {
              this.classList.toggle('fa-lock');
              this.classList.toggle('fa-unlock');
            } else {
              this.classList.toggle('fa-check-circle');
              this.classList.toggle('fa-eye');
            }
          });
        }
      });
    });
  </script>
</body>

</html>
