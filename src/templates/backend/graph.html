<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻传播图谱</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }

    #cy {
      width: 100%;
      height: 80vh;
      border: 1px solid #3f9bf7;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: #48c1e6;
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-top: 20px;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Tooltip 样式 */
    .cy-tooltip {
      position: absolute;
      padding: 8px 16px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 16px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>新闻传播图谱</h1>
    <div id="cy"></div>
  </div>

  <!-- 引入 Cytoscape.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.19.0/cytoscape.min.js"></script>
  <script>
    // 解析 URL 中的 'elements' 参数
    const urlParams = new URLSearchParams(window.location.search);
    const elementsParam = urlParams.get('elements');

    let elements = [];
    try {
      if (elementsParam) {
        elements = JSON.parse(decodeURIComponent(elementsParam));
      }
    } catch (e) {
      console.error("Invalid JSON in elements:", e);
      elements = [];
    }

    if (elements.length === 0) {
      console.error("No valid elements provided.");
    }

    // 初始化 Cytoscape
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: elements,
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'background-color': '#2c3e50',
            'text-valign': 'center',
            'text-halign': 'center',
            'color': '#ffffff',
            'font-size': '12px',
            'border-width': 1,
            'border-color': '#34495e'
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#bdc3c7',
            'curve-style': 'bezier',
            'label': 'data(label)',
            'font-size': '10px',
            'text-background-color': '#2c3e50',
            'text-background-opacity': 0.8,
            'text-background-padding': '2px'
          }
        }
      ],
      layout: {
        name: 'cose',
        animate: true,
        fit: true,
        padding: 10
      }
    });

    // 节点鼠标悬停效果
    cy.nodes().on('mouseover', function (event) {
      const node = event.target;
      node.style('background-color', '#2980b9');
      node.style('border-color', '#3498db');
      showTooltip(node);
    });

    cy.nodes().on('mouseout', function (event) {
      const node = event.target;
      node.style('background-color', '#2c3e50');
      node.style('border-color', '#34495e');
      hideTooltip();
    });

    // 边鼠标悬停效果
    cy.edges().on('mouseover', function (event) {
      const edge = event.target;
      edge.style('line-color', '#2980b9');
      edge.style('width', 3);
      showTooltip(edge);
    });

    cy.edges().on('mouseout', function (event) {
      const edge = event.target;
      edge.style('line-color', '#bdc3c7');
      edge.style('width', 2);
      hideTooltip();
    });

    // Tooltip 显示和隐藏
    let tooltip = null;

    function showTooltip(element) {
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.className = 'cy-tooltip';
        document.body.appendChild(tooltip);
      }

      const text = element.isNode()
        ? `节点: ${element.data('label')}\n类型: ${element.data('type') || ''}`
        : `关系: ${element.data('label')}\n类型: ${element.data('type') || ''}`;

      tooltip.textContent = text;

      // 设置tooltip位置
      const pos = element.position();
      const centerX = pos.x;
      const centerY = pos.y;
      const boundingBox = element.renderedBoundingBox;

      let x = centerX + 10;
      let y = centerY - 10;

      // 确保tooltip在可视区域内
      if (x < 0) x = 0;
      if (y < 0) y = 0;

      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y}px`;
      tooltip.style.display = 'block';
    }

    function hideTooltip() {
      if (tooltip) {
        tooltip.style.display = 'none';
      }
    }
  </script>
</body>

</html>
