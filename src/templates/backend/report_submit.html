<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>证据链提交系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/backend/css/report_submit.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
  <header class="header">
    <h1>证据链提交系统</h1>
    <p>安全、高效地提交和管理您的证据</p>
  </header>

  <main class="main-content">
    <div class="container">
      <h2>提交新证据</h2>

      <!-- 表单 -->
      <form id="evidenceForm">
        <div class="form-group">
          <label for="title">证据标题</label>
          <div class="input-icon">
            <i class="fas fa-heading"></i>
            <input type="text" id="title" name="title" placeholder="请输入证据标题" required>
          </div>
        </div>

        <div class="form-group">
          <label for="content">证据内容</label>
          <div class="input-icon">
            <i class="fas fa-file-alt"></i>
            <textarea id="content" name="content" placeholder="请详细描述证据内容..." required></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="category">证据类别</label>
          <div class="input-icon">
            <i class="fas fa-tag"></i>
            <select id="category" name="category" required>
              <option value="" disabled selected>请选择证据类别</option>
              <option value="聊天记录">聊天记录</option>
              <option value="银行流水">银行流水</option>
              <option value="视频证据">视频证据</option>
              <option value="图片证据">图片证据</option>
              <option value="文档证据">文档证据</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="source">证据来源</label>
          <div class="input-icon">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" id="source" name="source" placeholder="请输入证据来源" required>
          </div>
        </div>

        <div class="form-group">
          <label for="related_case">关联案件</label>
          <div class="input-icon">
            <i class="fas fa-gavel"></i>
            <input type="text" id="related_case" name="related_case" placeholder="请输入关联案件编号或名称" required>
          </div>
        </div>

        <div class="form-group">
          <label for="file_type">文件类型</label>
          <div class="input-icon">
            <i class="fas fa-file"></i>
            <input type="text" id="file_type" name="file_type" placeholder="请输入文件类型（如：文本、图片、视频）" required>
          </div>
        </div>

        <!-- 文件上传区域 -->
        <div class="form-group">
          <label>附件上传</label>
          <div class="file-upload" id="fileUploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>拖放文件到此处或 <strong>点击上传</strong></p>
            <p class="file-hint">支持的格式：PDF, JPG, PNG, MP4, DOC等</p>
          </div>
          <div class="file-list" id="fileList"></div>
        </div>

        <div class="btn-container">
          <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i>提交证据</button>
        </div>

        <!-- 状态消息 -->
        <div id="statusMessage" class="status-message"></div>
      </form>
    </div>
  </main>

  <script>
    // 文件上传区域交互
    const fileUploadArea = document.getElementById('fileUploadArea');
    const fileList = document.getElementById('fileList');

    // 模拟文件上传功能
    fileUploadArea.addEventListener('click', () => {
      // 这里可以添加实际的文件上传逻辑
      alert('文件上传功能将在后续版本中实现');
    });

    // 表单提交处理
    document.getElementById('evidenceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const submitBtn = document.querySelector('.submit-btn');
      const statusMessage = document.getElementById('statusMessage');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

        const response = await axios.post('/api/evidence', {
          title: formData.get('title'),
          content: formData.get('content'),
          category: formData.get('category'),
          source: formData.get('source'),
          related_case: formData.get('related_case'),
          file_type: formData.get('file_type')
        });

        if (response.data.success) {
          statusMessage.textContent = '✅ 证据提交成功！';
          statusMessage.className = 'status-message success';
          statusMessage.style.display = 'block';
          e.target.reset();

          // 3秒后隐藏成功消息
          setTimeout(() => {
            statusMessage.style.display = 'none';
          }, 3000);
        } else {
          statusMessage.textContent = '❌ 提交失败：' + response.data.message;
          statusMessage.className = 'status-message error';
          statusMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('提交失败:', error);
        statusMessage.textContent = '❌ 提交失败，请检查网络连接后重试';
        statusMessage.className = 'status-message error';
        statusMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交证据';
      }
    });
  </script>
</body>

</html>
