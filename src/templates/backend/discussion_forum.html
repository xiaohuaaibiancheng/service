<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时讨论区</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/backend/css/discussion_forum.css">
</head>

<body>
  <div class="container">
    <h2>实时讨论区</h2>
    <div class="chat-container" id="chat-container">
      <div class="empty-state" id="empty-state">
        <i class="fas fa-comments"></i>
        <p>暂无消息，开始聊天吧！</p>
      </div>
      <div class="typing-indicator" id="typing-indicator">
        有人正在输入<span></span><span></span><span></span>
      </div>
    </div>
    <div class="message-status">
      <span class="dot"></span>
      <span class="status">消息已发送</span>
    </div>
    <div class="input-area">
      <input type="text" id="message-input" placeholder="输入你的消息...">
      <div class="emoji-picker">
        <button onclick="insertEmoji('😊')" title="微笑">😊</button>
        <button onclick="insertEmoji('❤️')" title="爱心">❤️</button>
        <button onclick="insertEmoji('👍')" title="赞">👍</button>
        <button onclick="insertEmoji('🎉')" title="庆祝">🎉</button>
      </div>
      <button class="send-button" id="send-button">
        <i class="fas fa-paper-plane"></i> 发送
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
  <script>
    // 加载消息历史
    function getMessageHistory() {
      const history = localStorage.getItem('messageHistory');
      return history ? JSON.parse(history) : [];
    }

    // 保存消息到本地存储
    function saveMessage(message) {
      let history = getMessageHistory();
      history.push(message);
      localStorage.setItem('messageHistory', JSON.stringify(history));
    }

    // 初始化WebSocket连接
    const socket = io();

    // 显示消息状态
    function showMessageStatus(message = "消息已发送") {
      const status = document.querySelector('.message-status');
      const statusText = document.querySelector('.message-status .status');
      statusText.textContent = message;
      status.style.display = 'flex';
      setTimeout(() => {
        status.style.display = 'none';
      }, 3000);
    }

    // 插入表情符号
    function insertEmoji(emoji) {
      const input = document.getElementById('message-input');
      input.value += emoji + ' ';
      input.focus();
    }

    // 渲染消息
    function renderMessage(message) {
      const container = document.getElementById('chat-container');
      const emptyState = document.getElementById('empty-state');

      // 隐藏空状态提示
      if (emptyState) {
        emptyState.style.display = 'none';
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${message.author === '系统' ? 'right-message' : 'left-message'}`;

      const authorSpan = document.createElement('div');
      authorSpan.className = 'message-author';

      // 添加用户图标
      const icon = document.createElement('i');
      icon.className = message.author === '系统' ? 'fas fa-user-shield' : 'fas fa-user';
      authorSpan.appendChild(icon);

      const authorText = document.createTextNode(message.author);
      authorSpan.appendChild(authorText);

      const timeSpan = document.createElement('div');
      timeSpan.className = 'message-time';
      timeSpan.textContent = message.timestamp;

      const contentSpan = document.createElement('div');
      contentSpan.className = 'message-content';
      contentSpan.textContent = message.content;

      messageDiv.appendChild(authorSpan);
      messageDiv.appendChild(timeSpan);
      messageDiv.appendChild(contentSpan);

      container.appendChild(messageDiv);

      // 滚动到最新消息
      container.scrollTop = container.scrollHeight;
    }

    // 加载历史消息
    window.addEventListener('DOMContentLoaded', () => {
      const history = getMessageHistory();
      const emptyState = document.getElementById('empty-state');

      if (history.length > 0) {
        emptyState.style.display = 'none';
        history.forEach(msg => renderMessage(msg));
      }

      // 添加回车键发送功能
      document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('send-button').click();
        }
      });
    });

    // 监听新消息
    socket.on('message_received', (msg) => {
      renderMessage(msg);
      saveMessage(msg);
    });

    // 模拟"正在输入"状态
    socket.on('user_typing', () => {
      const typingIndicator = document.getElementById('typing-indicator');
      typingIndicator.style.display = 'block';

      setTimeout(() => {
        typingIndicator.style.display = 'none';
      }, 3000);
    });

    // 发送消息
    document.getElementById('send-button').addEventListener('click', () => {
      const input = document.getElementById('message-input');
      const content = input.value.trim();

      if (content) {
        input.value = '';

        // 发送消息到服务器，不需要指定 author，后端会处理
        socket.emit('new_message', { content: content });

        // 显示发送状态
        showMessageStatus();
      }
    });

    // 自动滚动
    window.addEventListener('resize', () => {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    });
  </script>
</body>

</html>
