<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计</title>
  <link rel="stylesheet" href="/static/backend/css/statistic.css">
</head>

<body>
  <div class="card-container">
    <div class="data-stats">
      <div class="stat-item">
        <div class="stat-value">{{ stats.total_rumors }}</div>
        <div class="stat-label">总谣言数量</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">{{ stats.handled_rumors }}</div>
        <div class="stat-label">已处理谣言数量</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">{{ stats.handling_rate }}%</div>
        <div class="stat-label">处置率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">{{ stats.avg_response_time }}小时</div>
        <div class="stat-label">平均响应时间</div>
      </div>
    </div>
  </div>
</body>

</html>
