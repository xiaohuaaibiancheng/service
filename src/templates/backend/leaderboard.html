<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线索贡献排行榜</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 页面基础样式 */
    :root {
      --primary-color: #3f51b5;
      --secondary-color: #7986cb;
      --accent-color: #ff4081;
      --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.1), 0 6px 6px rgba(0, 0, 0, 0.05);
      --hover-transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--background-gradient);
      color: #333;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 页面容器 */
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      width: 100%;
      max-width: 1000px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .header {
      margin-bottom: 30px;
      position: relative;
    }

    h2 {
      color: var(--primary-color);
      font-size: 2.5em;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: var(--accent-color);
      border-radius: 2px;
    }

    .last-update {
      color: #666;
      font-size: 0.9em;
      margin-top: 15px;
    }

    /* 表格样式 */
    .leaderboard-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 20px;
      background: white;
      overflow: hidden;
    }

    th,
    td {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 1px;
      position: sticky;
      top: 0;
    }

    th:first-child {
      border-top-left-radius: 8px;
    }

    th:last-child {
      border-top-right-radius: 8px;
    }

    tbody tr {
      transition: var(--hover-transition);
    }

    tbody tr:nth-child(even) {
      background-color: #f8f9ff;
    }

    tbody tr:hover {
      background-color: #e8eaff;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    /* 排名样式 */
    .rank {
      font-weight: bold;
      font-size: 1.2em;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .rank-1 {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
      box-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
    }

    .rank-2 {
      background: linear-gradient(135deg, #C0C0C0, #A9A9A9);
      color: white;
      box-shadow: 0 2px 10px rgba(192, 192, 192, 0.5);
    }

    .rank-3 {
      background: linear-gradient(135deg, #CD7F32, #8B4513);
      color: white;
      box-shadow: 0 2px 10px rgba(205, 127, 50, 0.5);
    }

    /* 用户头像和排名变化 */
    .user-info {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .avatar {
      border-radius: 50%;
      width: 45px;
      height: 45px;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: var(--hover-transition);
    }

    .avatar:hover {
      transform: scale(1.1);
    }

    .username {
      font-weight: 600;
      margin-left: 10px;
      text-align: left;
    }

    .score {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1.1em;
    }

    .rank-change {
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.9em;
    }

    .rank-change.positive {
      color: #2e7d32;
      background-color: rgba(46, 125, 50, 0.1);
    }

    .rank-change.negative {
      color: #c62828;
      background-color: rgba(198, 40, 40, 0.1);
    }

    .rank-change i {
      margin-right: 4px;
    }

    .status {
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.85em;
    }

    .status.online {
      color: #2e7d32;
      background-color: rgba(46, 125, 50, 0.1);
    }

    .status.offline {
      color: #757575;
      background-color: rgba(117, 117, 117, 0.1);
    }

    .status i {
      margin-right: 5px;
    }

    .country {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .country-flag {
      width: 24px;
      height: 24px;
      margin-right: 8px;
      border-radius: 4px;
      object-fit: cover;
    }

    /* 加载动画 */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(63, 81, 181, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 响应式布局 */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        border-radius: 12px;
      }

      h2 {
        font-size: 1.8em;
      }

      th,
      td {
        padding: 12px 8px;
        font-size: 0.9em;
      }

      .avatar {
        width: 35px;
        height: 35px;
      }

      .rank {
        width: 30px;
        height: 30px;
        font-size: 1em;
      }
    }

    @media (max-width: 576px) {
      .container {
        padding: 15px;
      }

      th,
      td {
        padding: 10px 5px;
        font-size: 0.8em;
      }

      .hide-on-mobile {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h2>线索贡献排行榜</h2>
      <div class="last-update" id="lastUpdate">最后更新: <span id="updateTime">加载中...</span></div>
    </div>

    <div class="leaderboard-wrapper">
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
      </div>
      <table id="leaderboard" style="display: none;">
        <thead>
          <tr>
            <th>排名</th>
            <th>用户</th>
            <th>贡献分数</th>
            <th>排名变动</th>
            <th>最后活跃</th>
            <th>状态</th>
            <th class="hide-on-mobile">国家/地区</th>
          </tr>
        </thead>
        <tbody>
          <!-- 动态填充排行榜内容 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 获取当前时间
    function updateCurrentTime() {
      const now = new Date();
      document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN');
    }

    // 获取排行榜数据
    function fetchLeaderboardData() {
      fetch('/leaderboard')
        .then(response => response.json())
        .then(data => {
          // 隐藏加载动画，显示表格
          document.getElementById('loading').style.display = 'none';
          document.getElementById('leaderboard').style.display = 'table';

          const leaderboardTable = document.getElementById("leaderboard").getElementsByTagName('tbody')[0];
          data.leaderboard.forEach((user, index) => {
            const rankNum = index + 1;
            const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';

            // 排名变化图标和类
            let rankChangeIcon = '';
            let rankChangeClass = '';

            if (user.rank_change.startsWith("+")) {
              rankChangeIcon = '<i class="fas fa-arrow-up"></i>';
              rankChangeClass = 'positive';
            } else if (user.rank_change.startsWith("-")) {
              rankChangeIcon = '<i class="fas fa-arrow-down"></i>';
              rankChangeClass = 'negative';
            } else {
              rankChangeIcon = '<i class="fas fa-minus"></i>';
              rankChangeClass = '';
            }

            // 状态图标和类
            const statusIcon = user.status === "在线" ?
              '<i class="fas fa-circle"></i>' :
              '<i class="far fa-circle"></i>';
            const statusClass = user.status === "在线" ? "online" : "offline";

            // 国家旗帜图片URL (假设API返回的是国家代码)
            const countryCode = user.country_code || 'cn'; // 默认中国
            const flagUrl = `https://flagcdn.com/32x24/${countryCode.toLowerCase()}.png`;

            const row = leaderboardTable.insertRow();
            row.innerHTML = `
              <td><div class="rank ${rankClass}">${rankNum}</div></td>
              <td class="user-info">
                <img src="${user.avatar}" class="avatar" alt="${user.name}的头像">
                <span class="username">${user.name}</span>
              </td>
              <td><span class="score">${user.score}</span></td>
              <td><span class="rank-change ${rankChangeClass}">${rankChangeIcon} ${user.rank_change}</span></td>
              <td>${user.last_updated}</td>
              <td><span class="status ${statusClass}">${statusIcon} ${user.status}</span></td>
              <td class="country hide-on-mobile">
                <img src="${flagUrl}" class="country-flag" alt="${user.country}">
                <span>${user.country}</span>
              </td>
            `;
          });

          // 更新时间
          updateCurrentTime();
        })
        .catch(error => {
          console.error('获取排行榜数据失败:', error);
          document.getElementById('loading').innerHTML = '<p>加载失败，请稍后再试</p>';
        });
    }

    // 页面加载完成后获取数据
    document.addEventListener('DOMContentLoaded', fetchLeaderboardData);
  </script>

</body>

</html>
