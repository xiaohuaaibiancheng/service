<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线索贡献排行榜</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/backend/css/leaderboard.css">
</head>

<body>

  <div class="container">
    <div class="header">
      <h2>线索贡献排行榜</h2>
      <div class="last-update" id="lastUpdate">最后更新: <span id="updateTime">加载中...</span></div>
    </div>

    <div class="leaderboard-wrapper">
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
      </div>
      <table id="leaderboard" style="display: none;">
        <thead>
          <tr>
            <th>排名</th>
            <th>用户</th>
            <th>贡献分数</th>
            <th>排名变动</th>
            <th>最后活跃</th>
            <th>状态</th>
            <th class="hide-on-mobile">国家/地区</th>
          </tr>
        </thead>
        <tbody>
          <!-- 动态填充排行榜内容 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 获取当前时间
    function updateCurrentTime() {
      const now = new Date();
      document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN');
    }

    // 获取排行榜数据
    function fetchLeaderboardData() {
      fetch('/leaderboard')
        .then(response => response.json())
        .then(data => {
          // 隐藏加载动画，显示表格
          document.getElementById('loading').style.display = 'none';
          document.getElementById('leaderboard').style.display = 'table';

          const leaderboardTable = document.getElementById("leaderboard").getElementsByTagName('tbody')[0];
          data.leaderboard.forEach((user, index) => {
            const rankNum = index + 1;
            const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';

            // 排名变化图标和类
            let rankChangeIcon = '';
            let rankChangeClass = '';

            if (user.rank_change.startsWith("+")) {
              rankChangeIcon = '<i class="fas fa-arrow-up"></i>';
              rankChangeClass = 'positive';
            } else if (user.rank_change.startsWith("-")) {
              rankChangeIcon = '<i class="fas fa-arrow-down"></i>';
              rankChangeClass = 'negative';
            } else {
              rankChangeIcon = '<i class="fas fa-minus"></i>';
              rankChangeClass = '';
            }

            // 状态图标和类
            const statusIcon = user.status === "在线" ?
              '<i class="fas fa-circle"></i>' :
              '<i class="far fa-circle"></i>';
            const statusClass = user.status === "在线" ? "online" : "offline";

            // 国家旗帜图片URL (假设API返回的是国家代码)
            const countryCode = user.country_code || 'cn'; // 默认中国
            const flagUrl = `https://flagcdn.com/32x24/${countryCode.toLowerCase()}.png`;

            const row = leaderboardTable.insertRow();
            row.innerHTML = `
              <td><div class="rank ${rankClass}">${rankNum}</div></td>
              <td class="user-info">
                <img src="${user.avatar}" class="avatar" alt="${user.name}的头像">
                <span class="username">${user.name}</span>
              </td>
              <td><span class="score">${user.score}</span></td>
              <td><span class="rank-change ${rankChangeClass}">${rankChangeIcon} ${user.rank_change}</span></td>
              <td>${user.last_updated}</td>
              <td><span class="status ${statusClass}">${statusIcon} ${user.status}</span></td>
              <td class="country hide-on-mobile">
                <img src="${flagUrl}" class="country-flag" alt="${user.country}">
                <span>${user.country}</span>
              </td>
            `;
          });

          // 更新时间
          updateCurrentTime();
        })
        .catch(error => {
          console.error('获取排行榜数据失败:', error);
          document.getElementById('loading').innerHTML = '<p>加载失败，请稍后再试</p>';
        });
    }

    // 页面加载完成后获取数据
    document.addEventListener('DOMContentLoaded', fetchLeaderboardData);
  </script>

</body>

</html>
