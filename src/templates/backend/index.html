    <main class="dashboard">
        <div class="card-container">
            <h2><i class="fas fa-map-marked-alt"></i> 热点地图</h2>
            <div class="map-container">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div class="loading-text">地图数据加载中，首次加载可能需要较长时间...</div>
                </div>
                <div class="map-controls">
                    <button class="map-control-btn" id="refreshMapBtn" title="刷新地图">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="map-control-btn" id="fullscreenMapBtn" title="全屏查看">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
                <iframe id="map-iframe" data-src="/map" frameborder="0" scrolling="no" allowfullscreen></iframe>
            </div>
        </div>

        <div class="card-container">
            <h2><i class="fas fa-chart-bar"></i> 数据统计</h2>
            <iframe src="/statistic" frameborder="0"></iframe>
        </div>

        <div class="card-container">
            <h2><i class="fas fa-fire"></i> 热点谣言推荐</h2>
            <iframe src="/hotpot" frameborder="0"></iframe>
        </div>

        <div class="card-container">
            <h2><i class="fas fa-clock"></i> 24小时传播TOP6</h2>
            <iframe src="/dashboard" frameborder="0"></iframe>
        </div>

    <div class="alert-bubble" id="alert-bubble">
        <h4><i class="fas fa-exclamation-triangle"></i> 重大谣言警报</h4>

    </div>

    <div class="ai-popup" id="ai-popup">
        <button class="close-btn" id="close-btn">✖</button>
        <iframe src="/ai_assistant" frameborder="0"></iframe>
    </div>

    <div class="floating-buttons">
        <button class="floating-btn" id="history-btn">
            <i class="fas fa-history"></i> 检测历史库
        </button>
        <button class="floating-btn" id="report-btn">
            <i class="fas fa-flag"></i> 用户协作平台
        </button>
        <button class="floating-btn" id="ai-btn">
            <i class="fas fa-robot"></i> 本地知音
        </button>
    </div>

    <footer class="media-ranking">
        <div class="media-item">
            <div class="name">新华社</div>

        </div>

            <div class="name">人民日报</div>
            <div class="score" style="color: var(--green)">97.3</div>
        </div>
        <div class="media-item">
            <div class="name">央视</div>
            <div class="score" style="color: var(--green)">96.8</div>
        </div>
        <div class="media-item">
            <div class="name">中国日报</div>
            <div class="score" style="color: var(--green)">96.2</div>
        </div>
        <div class="media-item">
            <div class="name">光明日报</div>
            <div class="score" style="color: var(--green)">95.9</div>
        </div>
        <div class="media-item">

            <div class="score" style="color: var(--green)">95.5</div>
        </div>
        <div class="media-item">
            <div class="name">京华时报</div>
            <div class="score" style="color: var(--green)">94.8</div>
        </div>
        <div class="media-item">

            <div class="score" style="color: var(--green)">94.5</div>
        </div>

    <!-- 优化JavaScript代码，提高性能和可维护性 -->
    <script>
        // DOM元素缓存
        const elements = {
            historyBtn: document.getElementById("history-btn"),
            reportBtn: document.getElementById("report-btn"),
            aiBtn: document.getElementById("ai-btn"),
            aiPopup: document.getElementById("ai-popup"),
            closeBtn: document.getElementById("close-btn"),
            floatingButtons: document.querySelector('.floating-buttons'),
            mapIframe: document.getElementById('map-iframe'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            searchInput: document.getElementById('search-input'),
            searchResults: document.getElementById('search-results'),
            alertBubble: document.getElementById('alert-bubble'),
            countdown: document.getElementById('countdown'),
            refreshMapBtn: document.getElementById('refreshMapBtn'),
            fullscreenMapBtn: document.getElementById('fullscreenMapBtn')
        };

        // 初始化函数
        function init() {
            setupEventListeners();
            setupFloatingButtons();
            setupMapLoading();
            setupSearchFunctionality();
            setupAlertSystem();
            setupMapControls();
        }

        // 设置事件监听器
        function setupEventListeners() {
            elements.historyBtn.addEventListener("click", () => window.location.href = "/list");
            elements.reportBtn.addEventListener("click", () => window.location.href = "/report");
            elements.aiBtn.addEventListener("click", showAiPopup);
            elements.closeBtn.addEventListener("click", hideAiPopup);
        }

        // AI助手弹窗功能
        function showAiPopup() {
            elements.aiPopup.style.display = "block";
            // 使用setTimeout确保过渡效果生效
            setTimeout(() => {
                elements.aiPopup.classList.add("show");
            }, 10);
        }

        function hideAiPopup() {
            elements.aiPopup.classList.remove("show");
            // 等待过渡效果完成后隐藏
            setTimeout(() => {
                elements.aiPopup.style.display = "none";
            }, 400);
        }

        // 悬浮按钮功能
        function setupFloatingButtons() {
            const buttons = document.querySelectorAll('.floating-btn');

            elements.floatingButtons.addEventListener('mouseover', () => {
                buttons.forEach((button, index) => {
                    // 添加延迟，创建连锁动画效果
                    setTimeout(() => {
                        button.style.transform = 'translateY(0)';
                        button.style.opacity = '1';
                    }, index * 100);
                });
            });

            elements.floatingButtons.addEventListener('mouseleave', () => {
                buttons.forEach((button, index) => {
                    // 添加延迟，创建连锁动画效果
                    setTimeout(() => {
                        button.style.transform = 'translateY(100px)';
                        button.style.opacity = '0';
                    }, (buttons.length - index - 1) * 100);
                });
            });
        }

        // 地图加载功能
        function setupMapLoading() {
            // 使用Intersection Observer延迟加载iframe
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 当地图容器进入视口时才加载iframe
                        const iframe = entry.target;
                        const src = iframe.getAttribute('data-src');
                        if (src) {
                            // 检查是否已经加载过地图
                            const isMapLoaded = sessionStorage.getItem('mapLoaded');

                            // 设置一个短暂的延迟，让页面其他部分先加载完
                            setTimeout(() => {
                                // 如果是首次访问，正常加载地图
                                if (!isMapLoaded) {
                                    iframe.setAttribute('src', src);
                                    // 标记已加载
                                    sessionStorage.setItem('mapLoaded', 'true');
                                } else {
                                    // 非首次加载，使用缓存版本的URL
                                    iframe.setAttribute('src', src);
                                }

                                iframe.onload = () => {
                                    // 地图加载完成后，淡入显示并隐藏加载动画
                                    iframe.style.opacity = '1';
                                    elements.loadingOverlay.style.opacity = '0';
                                    setTimeout(() => {
                                        elements.loadingOverlay.style.display = 'none';
                                    }, 500);
                                };
                            }, 300);
                        }
                        // 加载后取消观察
                        observer.unobserve(iframe);
                    }
                });
            }, {
                threshold: 0.1 // 当10%的元素可见时触发
            });

            // 开始观察地图iframe
            observer.observe(elements.mapIframe);
        }

        // 设置地图控制按钮
        function setupMapControls() {
            // 刷新地图按钮
            if (elements.refreshMapBtn) {
                elements.refreshMapBtn.addEventListener('click', () => {
                    // 显示加载动画
                    elements.loadingOverlay.style.display = 'flex';
                    elements.loadingOverlay.style.opacity = '1';

                    // 清除缓存标记，强制重新加载
                    sessionStorage.removeItem('mapLoaded');

                    // 重新加载iframe
                    const src = elements.mapIframe.getAttribute('data-src');
                    elements.mapIframe.style.opacity = '0';

                    setTimeout(() => {
                        // 添加时间戳参数强制刷新
                        elements.mapIframe.setAttribute('src', src + '?refresh=' + new Date().getTime());
                        elements.mapIframe.onload = () => {
                            elements.mapIframe.style.opacity = '1';
                            elements.loadingOverlay.style.opacity = '0';
                            setTimeout(() => {
                                elements.loadingOverlay.style.display = 'none';
                            }, 500);

                            // 重新标记为已加载
                            sessionStorage.setItem('mapLoaded', 'true');
                        };
                    }, 200);
                });
            }

            // 全屏按钮
            if (elements.fullscreenMapBtn) {
                elements.fullscreenMapBtn.addEventListener('click', function () {
                    const mapContainer = elements.mapIframe.closest('.map-container');

                    if (document.fullscreenElement) {
                        document.exitFullscreen()
                            .then(() => {
                                elements.fullscreenMapBtn.innerHTML = '<i class="fas fa-expand"></i>';
                                elements.fullscreenMapBtn.title = '全屏查看';
                            })
                            .catch(err => {
                                console.error('退出全屏失败:', err);
                            });
                    } else {
                        mapContainer.requestFullscreen()
                            .then(() => {
                                elements.fullscreenMapBtn.innerHTML = '<i class="fas fa-compress"></i>';
                                elements.fullscreenMapBtn.title = '退出全屏';
                            })
                            .catch(err => {
                                console.error('进入全屏失败:', err);
                            });
                    }
                });
            }
        }

        // 搜索功能
        function setupSearchFunctionality() {
            let searchTimeout;

            elements.searchInput.addEventListener('input', function () {
                const query = this.value;

                // 清除之前的超时
                clearTimeout(searchTimeout);

                // 清空结果容器
                elements.searchResults.innerHTML = '';

                if (query.length >= 1) {
                    // 设置延迟，减少请求频率
                    searchTimeout = setTimeout(() => {
                        fetchSearchResults(query);
                    }, 300);
                }
            });

            // 点击其他地方关闭搜索结果
            document.addEventListener('click', function (e) {
                if (!elements.searchBar.contains(e.target)) {
                    elements.searchResults.innerHTML = '';
                }
            });
        }

        // 获取搜索结果
        function fetchSearchResults(query) {
            fetch(`/search?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    elements.searchResults.innerHTML = '';

                    if (data.length > 0) {
                        data.forEach(result => {
                            const resultElement = document.createElement('div');
                            resultElement.classList.add('search-result-item');
                            resultElement.innerHTML = `<a href="/news/${result.news_id}">${result.title}</a>`;
                            elements.searchResults.appendChild(resultElement);
                        });
                    } else {
                        elements.searchResults.innerHTML = '<div class="search-result-item">没有找到相关内容</div>';
                    }
                })
                .catch(error => {
                    console.error('搜索请求失败:', error);
                    elements.searchResults.innerHTML = '<div class="search-result-item">搜索服务暂时不可用</div>';
                });
        }

        // 警报系统
        function setupAlertSystem() {
            fetch('/api/active-alert')
                .then(response => {
                    if (!response.ok) {
                        elements.alertBubble.style.display = 'none';
                        throw new Error('无活跃警报');
                    }
                    return response.json();
                })
                .then(data => {
                    const { id, remaining_time } = data;

                    if (remaining_time <= 0) {
                        elements.alertBubble.style.display = 'none';
                        return;
                    }

                    // 存储alert ID到元素属性
                    elements.alertBubble.dataset.alertId = id;

                    // 点击事件处理
                    elements.alertBubble.addEventListener('click', function () {
                        const alertId = this.dataset.alertId;
                        fetch(`/api/alerts/${alertId}/resolve`, {
                            method: 'POST'
                        })
                            .then(() => {
                                window.location.href = `/news/${alertId}`;
                            })
                            .catch(() => {
                                window.location.href = `/news/${alertId}`;
                            });
                    });

                    // 启动倒计时
                    startCountdown(remaining_time);
                })
                .catch(() => {
                    elements.alertBubble.style.display = 'none';
                });
        }

        // 倒计时功能
        function startCountdown(seconds) {
            let timeLeft = seconds;

            const timer = setInterval(() => {
                timeLeft = Math.max(timeLeft - 1, 0);

                // 更新显示时间
                const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const secs = String(timeLeft % 60).padStart(2, '0');
                elements.countdown.textContent = `剩余处置时间: ${mins}:${secs}`;

                // 倒计时结束处理
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    elements.alertBubble.style.display = 'none';
                }
            }, 1000);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);

        document.addEventListener('DOMContentLoaded', function () {
            // 为导航栏中的链接添加点击事件
            document.getElementById('history-link').addEventListener('click', function () {
                document.getElementById('history-btn').click();
            });

            document.getElementById('ai-link').addEventListener('click', function () {
                document.getElementById('ai-btn').click();
            });

            document.getElementById('report-link').addEventListener('click', function () {
                document.getElementById('report-btn').click();
            });
        });
    </script>
</body>
