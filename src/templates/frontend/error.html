{% extends "frontend/base.html" %}

{% block title %}出错了 - FakeNews{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='frontend/css/error.css') }}">
{% endblock %}

{% block content %}
<!-- 添加动态背景容器 -->
<div class="animated-background">
  <div class="floating-particles"></div>
  <div class="grid-overlay"></div>
</div>

<div class="error-container">
  <div class="error-icon">
    <i class="fas fa-exclamation-triangle"></i>
  </div>
  <h1 class="error-title">出错了</h1>
  <p class="error-message">{{ message }}</p>
  <div class="error-actions">
    <a href="/ai_chat" class="error-btn error-btn-primary">
      <i class="fas fa-comment"></i>
      开始新对话
    </a>
    <a href="/" class="error-btn">
      <i class="fas fa-home"></i>
      返回首页
    </a>
  </div>
</div>
{% endblock %}
