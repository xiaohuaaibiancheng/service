{% extends "frontend/base.html" %}

{% block title %}联系我们 - FakeNews{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='frontend/css/contact.css') }}">
{% endblock %}

{% block content %}
<!-- 动态背景 -->
<div class="animated-background">
    <div class="floating-particles"></div>
    <div class="grid-overlay"></div>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
</div>

<div class="contact-container">
    <div class="contact-title">
        <h1>联系我们</h1>
    </div>

    <!-- 联系方式 -->
    <div class="contact-methods">
        <div class="contact-card">
            <i class="fas fa-envelope"></i>
            <h3>电子邮件</h3>
            <p>support@fakenews.com</p>
        </div>
        <div class="contact-card">
            <i class="fas fa-phone-alt"></i>
            <h3>联系电话</h3>
            <p>+86 123 4567 8900</p>
        </div>
        <div class="contact-card">
            <i class="fas fa-map-marker-alt"></i>
            <h3>地址</h3>
            <p>中国北京市海淀区</p>
        </div>
    </div>

    <!-- 联系表单 -->
    <div class="contact-form">
        <h2 class="form-title">
            <i class="fas fa-paper-plane"></i>
            发送消息
        </h2>
        <form>
            <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" placeholder="请输入您的姓名">
            </div>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" placeholder="请输入您的邮箱">
            </div>
            <div class="form-group">
                <label class="form-label">主题</label>
                <input type="text" class="form-control" placeholder="请输入消息主题">
            </div>
            <div class="form-group">
                <label class="form-label">消息内容</label>
                <textarea class="form-control" placeholder="请输入您的消息内容"></textarea>
            </div>
            <button type="submit" class="submit-btn">发送消息</button>
        </form>
    </div>
</div>

<!-- 添加页面加载动画脚本 -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 为联系卡片添加延迟动画
        const cards = document.querySelectorAll('.contact-card');
        cards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 300 + (index * 150));
        });

        // 为表单添加延迟显示
        const form = document.querySelector('.contact-form');
        form.style.opacity = '0';
        form.style.transform = 'translateY(20px)';
        setTimeout(() => {
            form.style.transition = 'all 0.8s ease';
            form.style.opacity = '1';
            form.style.transform = 'translateY(0)';
        }, 800);
    });
</script>
{% endblock %}
